plugins {
    // Используем java-library для создания корректных вариантов сборки (variants)
    id("java-library")
}

group = "com.example"
version = "0.0.1-SNAPSHOT"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Заставляем Gradle собирать обычный JAR для этого модуля
tasks.jar {
    enabled = true
}

// Если плагин Spring Boot применяется ко всем модулям из корневого build.gradle,
// то мы безопасно отключаем bootJar через проверку его существования:
tasks.findByPath("bootJar")?.enabled = false

repositories {
    mavenCentral()
}

dependencies {
    // Для Lombok в Kotlin DSL обязательно использовать конфигурации compileOnly и annotationProcessor
    compileOnly("org.projectlombok:lombok:1.18.42") // Рекомендуется явно указать версию, если нет BOM
    annotationProcessor("org.projectlombok:lombok:1.18.42")
}

tasks.jar {
    enabled = true
    archiveClassifier.set("") // Очищаем классификатор, чтобы jar шел без суффиксов типа '-plain'
}
