<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop — Заказы</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #222; padding: 2rem; max-width: 700px; margin: 0 auto; }
        h1 { font-size: 1.6rem; margin-bottom: 1rem; }
        h2 { font-size: 1.2rem; margin-bottom: 0.5rem; }
        section { background: #fff; border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
        label { display: block; font-size: 0.85rem; margin-bottom: 0.25rem; color: #555; }
        input, select { width: 100%; padding: 0.5rem 0.75rem; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95rem; margin-bottom: 0.75rem; }
        button { padding: 0.55rem 1.2rem; border: none; border-radius: 6px; background: #1976d2; color: #fff; font-size: 0.95rem; cursor: pointer; }
        button:hover { background: #125ba3; }
        button:disabled { opacity: 0.5; cursor: default; }
        button.cancel { background: #d32f2f; }
        button.cancel:hover { background: #a82020; }
        .row { display: flex; gap: 0.75rem; }
        .row > * { flex: 1; }
        .msg { padding: 0.6rem 0.8rem; border-radius: 6px; font-size: 0.9rem; margin-top: 0.5rem; }
        .msg.error { background: #fdecea; color: #c62828; }
        .msg.ok { background: #e8f5e9; color: #2e7d32; }
        .order-item { border-bottom: 1px solid #eee; padding: 0.75rem 0; }
        .order-item:last-child { border-bottom: none; }
        .order-item strong { font-size: 1rem; }
        .order-item small { color: #777; display: block; margin-top: 0.25rem; }
        .status { display: inline-block; padding: 0.2rem 0.55rem; border-radius: 99px; font-size: 0.8rem; font-weight: 600; }
        .status-NEW { background: #e3f2fd; color: #1565c0; }
        .status-IN_PROGRESS { background: #fff3e0; color: #e65100; }
        .status-COMPLETED { background: #e8f5e9; color: #2e7d32; }
        .status-CANCELLED { background: #fdecea; color: #c62828; }
        .hidden { display: none; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        #user-info { font-size: 0.85rem; color: #555; }
        #btn-logout { background: #666; font-size: 0.8rem; padding: 0.35rem 0.8rem; }
    </style>
</head>
<body>
    <div class="top-bar">
        <h1>🐾 Shop — Заказы</h1>
        <div id="top-actions">
            <span id="user-info"></span>
            <button id="btn-logout" class="hidden" onclick="logout()">Выйти</button>
        </div>
    </div>

    <!-- Login -->
    <section id="login-section">
        <h2>Вход через Keycloak</h2>
        <label for="kc-user">Имя пользователя</label>
        <input id="kc-user" placeholder="admin">
        <label for="kc-pass">Пароль</label>
        <input id="kc-pass" type="password" placeholder="••••••">
        <button onclick="login()">Войти</button>
        <div id="login-msg"></div>
    </section>

    <!-- Create order -->
    <section id="create-section" class="hidden">
        <h2>Создать заказ</h2>
        <h3 style="font-size:0.95rem;margin-bottom:0.5rem;color:#555">Товар</h3>
        <div class="row">
            <div>
                <label for="product-id">Product ID</label>
                <input id="product-id" type="text" value="prod-001">
            </div>
            <div>
                <label for="product-name">Название товара</label>
                <input id="product-name" type="text" value="Корм для кошек">
            </div>
        </div>
        <div class="row">
            <div>
                <label for="quantity">Количество</label>
                <input id="quantity" type="number" min="1" value="1">
            </div>
            <div>
                <label for="unit-price">Цена за единицу</label>
                <input id="unit-price" type="number" min="0" step="0.01" value="10">
            </div>
        </div>
        <h3 style="font-size:0.95rem;margin:1rem 0 0.5rem;color:#555">Адрес доставки</h3>
        <label for="address-street">Улица</label>
        <input id="address-street" type="text" value="ул. Пушкина, 10">
        <div class="row">
            <div>
                <label for="address-city">Город</label>
                <input id="address-city" type="text" value="Москва">
            </div>
            <div>
                <label for="address-state">Регион</label>
                <input id="address-state" type="text" value="Москва">
            </div>
        </div>
        <div class="row">
            <div>
                <label for="address-zip">Индекс</label>
                <input id="address-zip" type="text" value="123456">
            </div>
            <div>
                <label for="address-country">Страна</label>
                <input id="address-country" type="text" value="RU">
            </div>
        </div>
        <button onclick="createOrder()">Создать заказ</button>
        <div id="create-msg"></div>
    </section>

    <!-- My orders -->
    <section id="orders-section" class="hidden">
        <h2>Мои заказы</h2>
        <button onclick="loadOrders()">Обновить</button>
        <div id="orders-list" style="margin-top:0.75rem"></div>
    </section>

    <!-- Order detail / tracking -->
    <section id="detail-section" class="hidden">
        <button onclick="backToOrders()" style="margin-bottom:1rem">← Назад к заказам</button>
        <h2 id="detail-title">Заказ</h2>
        <div id="detail-content"></div>
        <div style="margin-top:1rem">
            <button onclick="trackOrder()" id="btn-track">Обновить статус</button>
            <button onclick="cancelOrder()" class="cancel" id="btn-cancel">Отменить заказ</button>
        </div>
        <div id="detail-msg"></div>
    </section>

    <script>
    // ── URL конфигурация (работает через nginx-прокси внутри кластера) ──
    const KC_REALM_URL = '/auth/realms/ecommerce-realm/protocol/openid-connect/token';
    const API_BASE = '/api';

    let token = localStorage.getItem('token');
    let currentOrderId = null;

    // ── Auth ────────────────────────────────────────────────────────
    async function login() {
        const user = document.getElementById('kc-user').value.trim();
        const pass = document.getElementById('kc-pass').value.trim();
        const msg = document.getElementById('login-msg');

        if (!user || !pass) { showMsg(msg, 'Введите имя и пароль', 'error'); return; }

        try {
            const resp = await fetch(KC_REALM_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({
                    grant_type: 'password',
                    client_id: 'ecommerce-frontend',
                    username: user,
                    password: pass
                })
            });

            if (!resp.ok) {
                const err = await resp.json().catch(() => ({}));
                throw new Error(err.error_description || err.error || 'Ошибка входа');
            }

            const data = await resp.json();
            token = data.access_token;
            localStorage.setItem('token', token);
            showUI();
        } catch (e) {
            showMsg(msg, e.message, 'error');
        }
    }

    function logout() {
        token = null;
        localStorage.removeItem('token');
        hideSection('detail-section');
        hideSection('orders-section');
        hideSection('create-section');
        showSection('login-section');
        document.getElementById('user-info').textContent = '';
        document.getElementById('btn-logout').classList.add('hidden');
    }

    // ── Orders ──────────────────────────────────────────────────────
    async function createOrder() {
        const msg = document.getElementById('create-msg');

        const orderData = {
            address: {
                street: document.getElementById('address-street').value.trim(),
                city: document.getElementById('address-city').value.trim(),
                state: document.getElementById('address-state').value.trim(),
                zipCode: document.getElementById('address-zip').value.trim(),
                country: document.getElementById('address-country').value.trim()
            },
            items: [{
                productId: document.getElementById('product-id').value.trim(),
                productName: document.getElementById('product-name').value.trim(),
                quantity: parseInt(document.getElementById('quantity').value),
                unitPrice: parseFloat(document.getElementById('unit-price').value)
            }]
        };

        try {
            const resp = await apiFetch('/orders', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(orderData)
            });
            const order = await resp.json();
            showMsg(msg, `Заказ #${order.id} создан!`, 'ok');
            loadOrders();
        } catch (e) {
            showMsg(msg, e.message, 'error');
        }
    }

    async function loadOrders() {
        const list = document.getElementById('orders-list');
        try {
            const resp = await apiFetch('/orders');
            const orders = await resp.json();
            if (!orders.length) { list.innerHTML = '<p style="color:#888">Заказов пока нет</p>'; return; }
            list.innerHTML = orders.map(o => `
                <div class="order-item" style="cursor:pointer" onclick="showOrderDetail(${o.id})">
                    <strong>Заказ #${o.id}</strong>
                    <small>Статус: <span class="status status-${o.status || o.statusText || 'NEW'}">${o.status || o.statusText || 'NEW'}</span>
                    &nbsp;·&nbsp;${o.createdAt ? new Date(o.createdAt).toLocaleString('ru') : ''}</small>
                </div>
            `).join('');
        } catch (e) {
            list.innerHTML = `<p class="msg error">${e.message}</p>`;
        }
    }

    async function showOrderDetail(id) {
        currentOrderId = id;
        hideSection('orders-section');
        hideSection('create-section');
        showSection('detail-section');
        document.getElementById('detail-title').textContent = `Заказ #${id}`;
        document.getElementById('detail-msg').innerHTML = '';
        await trackOrder();
    }

    async function trackOrder() {
        const container = document.getElementById('detail-content');
        const msg = document.getElementById('detail-msg');
        try {
            const resp = await apiFetch(`/orders/${currentOrderId}/tracking`);
            const o = await resp.json();
            container.innerHTML = `
                <p><strong>Статус:</strong> <span class="status status-${o.status || o.statusText || 'NEW'}">${o.status || o.statusText || 'NEW'}</span></p>
                <p><small>Product ID: ${o.productId || '—'} · Qty: ${o.quantity || '—'}</small></p>
                ${o.createdAt ? `<p><small>Создан: ${new Date(o.createdAt).toLocaleString('ru')}</small></p>` : ''}
                ${o.updatedAt ? `<p><small>Обновлён: ${new Date(o.updatedAt).toLocaleString('ru')}</small></p>` : ''}
            `;
            const isCancelable = ['NEW'].includes(o.status || o.statusText || 'NEW');
            document.getElementById('btn-cancel').disabled = !isCancelable;
            document.getElementById('btn-cancel').style.display = isCancelable ? '' : 'none';
        } catch (e) {
            container.innerHTML = `<p class="msg error">${e.message}</p>`;
        }
    }

    async function cancelOrder() {
        const msg = document.getElementById('detail-msg');
        try {
            const resp = await apiFetch(`/orders/${currentOrderId}/cancel`, { method: 'POST' });
            const o = await resp.json();
            showMsg(msg, `Заказ #${currentOrderId} отменён`, 'ok');
            trackOrder();
        } catch (e) {
            showMsg(msg, e.message, 'error');
        }
    }

    function backToOrders() {
        currentOrderId = null;
        hideSection('detail-section');
        showSection('orders-section');
    }

    // ── Helpers ─────────────────────────────────────────────────────
    async function apiFetch(path, init = {}) {
        const headers = { 'Authorization': `Bearer ${token}`, ...(init.headers || {}) };
        const resp = await fetch(API_BASE + path, { ...init, headers });
        if (!resp.ok) {
            const err = await resp.json().catch(() => ({}));
            throw new Error(err.message || `HTTP ${resp.status}`);
        }
        return resp;
    }

    function showMsg(el, text, type) {
        el.innerHTML = `<div class="msg ${type}">${text}</div>`;
    }

    function showSection(id) { document.getElementById(id).classList.remove('hidden'); }
    function hideSection(id) { document.getElementById(id).classList.add('hidden'); }

    function showUI() {
        hideSection('login-section');
        showSection('create-section');
        showSection('orders-section');
        document.getElementById('user-info').textContent = '✓ Авторизован';
        document.getElementById('btn-logout').classList.remove('hidden');
        loadOrders();
    }

    // Auto-login if token exists
    if (token) showUI();
    </script>
</body>
</html>
