apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: ecommerce
  labels:
    app: order-service
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: ecommerce/order-service:v4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http

          env:
            # Активный профиль
            - name: SPRING_PROFILES_ACTIVE
              value: "kubernetes"

            # PostgreSQL
            - name: DB_URL
              value: "jdbc:postgresql://order-service-postgresql-service:5432/order_db"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password

            # Kafka — FIX: Исправлены адреса и порты
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-0.kafka-svc.ecommerce.svc.cluster.local:9092,kafka-1.kafka-svc.ecommerce.svc.cluster.local:9092,kafka-2.kafka-svc.ecommerce.svc.cluster.local:9092"
            - name: KAFKA_CONSUMER_GROUP_ID
              value: "order-service-group"

            # Keycloak
            - name: KEYCLOAK_ISSUER_URI
              value: "http://keycloak.ecommerce:8080/realms/ecommerce-realm"
            - name: KEYCLOAK_JWK_URI
              value: "http://keycloak.ecommerce:8080/ecommerce-realm/protocol/openid-connect/certs"

            # Логирование
            - name: LOG_LEVEL
              value: "DEBUG"

          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 90
            periodSeconds: 15

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10

          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 0
            periodSeconds: 10
            failureThreshold: 30

      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: ecommerce
spec:
  selector:
    app: order-service
  ports:
    - port: 8081
      targetPort: 8081
      name: http
  type: ClusterIP