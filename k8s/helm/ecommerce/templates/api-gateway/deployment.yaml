{{- if .Values.services.apiGateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: {{ .Values.namespace | default "ecommerce" }}
  labels:
    app: api-gateway
    {{- include "ecommerce.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.services.apiGateway.replicas | default 2 }}
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        {{- include "ecommerce.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: api-gateway
          image: "{{ .Values.images.registry }}/{{ .Values.services.apiGateway.image.repository }}:{{ .Values.services.apiGateway.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.services.apiGateway.port | default 9000 }}
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "kubernetes"
            - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT-ID
              value: {{ .Values.secrets.apiGateway.clientId | default "api-gateway" }}
            - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT-SECRET
              value: {{ .Values.secrets.apiGateway.clientSecret | default "api-gateway-secret" }}
            - name: LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_CLOUD_GATEWAY
              value: "DEBUG"
          resources:
            {{- toYaml .Values.services.apiGateway.resources | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.services.apiGateway.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.services.apiGateway.readinessProbe | nindent 12 }}
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: {{ .Values.namespace | default "ecommerce" }}
  labels:
    app: api-gateway
    {{- include "ecommerce.labels" . | nindent 4 }}
spec:
  selector:
    app: api-gateway
  ports:
    - port: {{ .Values.services.apiGateway.port | default 9000 }}
      targetPort: {{ .Values.services.apiGateway.port | default 9000 }}
      name: http
      protocol: TCP
  type: ClusterIP
{{- end }}
