apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: {{ .Values.namespace | default "ecommerce" }}
  labels:
    {{- include "ecommerce.labels" . | nindent 4 }}
type: Opaque
data:
  username: {{ .Values.secrets.postgres.username | b64enc | quote }}
  password: {{ .Values.secrets.postgres.password | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
  namespace: {{ .Values.namespace | default "ecommerce" }}
  labels:
    {{- include "ecommerce.labels" . | nindent 4 }}
type: Opaque
data:
  username: {{ .Values.secrets.mongodb.username | b64enc | quote }}
  password: {{ .Values.secrets.mongodb.password | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secret
  namespace: {{ .Values.namespace | default "ecommerce" }}
  labels:
    {{- include "ecommerce.labels" . | nindent 4 }}
type: Opaque
data:
  admin-password: {{ .Values.secrets.keycloak.adminPassword | b64enc | quote }}
  db-username: {{ .Values.secrets.keycloak.dbUsername | b64enc | quote }}
  db-password: {{ .Values.secrets.keycloak.dbPassword | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: api-gateway-secret
  namespace: {{ .Values.namespace | default "ecommerce" }}
  labels:
    {{- include "ecommerce.labels" . | nindent 4 }}
type: Opaque
data:
  client-id: {{ .Values.secrets.apiGateway.clientId | b64enc | quote }}
  client-secret: {{ .Values.secrets.apiGateway.clientSecret | b64enc | quote }}
