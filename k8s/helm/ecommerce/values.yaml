# Default values for ecommerce.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

namespace: ecommerce

fullnameOverride: ecommerce

# -- Registry for application images
images:
  registry: ecommerce

# -- Secrets (will be base64-encoded in templates)
secrets:
  postgres:
    username: admin
    password: password
  mongodb:
    username: admin
    password: password
  keycloak:
    adminPassword: admin123
    dbUsername: admin123
    dbPassword: keycloak_pass
  apiGateway:
    clientId: api-gateway
    clientSecret: api-gateway-secret

# -- Keycloak configuration
keycloak:
  enabled: true
  mode: prod  # "prod" or "dev"
  replicas: 1
  image:
    repository: quay.io/keycloak/keycloak
    tag: "24.0"
  port: 8080
  hostname: keycloak.ecommerce.svc.cluster.local:8080
  realm: ecommerce-realm
  resources:
    requests:
      memory: 2Gi
      cpu: 500m
    limits:
      memory: 3Gi
      cpu: 2000m
  startupProbe:
    tcpSocket:
      port: 8080
    initialDelaySeconds: 0
    periodSeconds: 10
    failureThreshold: 30
  livenessProbe:
    tcpSocket:
      port: 8080
    initialDelaySeconds: 60
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    tcpSocket:
      port: 8080
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# -- Keycloak PostgreSQL
keycloakPostgres:
  enabled: true
  image:
    repository: postgres
    tag: "15"
  port: 5432
  dbName: keycloak
  storage: 10Gi
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 1Gi
      cpu: 500m

# -- Kafka configuration
kafka:
  enabled: true
  replicas: 3
  image:
    repository: doughgle/kafka-kraft
    tag: latest
  port: 9092
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 1Gi
      cpu: 500m
  storage: 1Gi
  clusterID: 4L62ydgNTm6v-lkZ9Z7Sxw

# -- Kafka Topics creation job
kafkaTopics:
  enabled: true
  image:
    repository: doughgle/kafka-kraft
    tag: latest
  topics:
    - name: order-created
      partitions: 12
    - name: order-events-dlq
      partitions: 12
    - name: inventory-reserved
      partitions: 12
    - name: payment-completed
      partitions: 12
    - name: payment-failed
      partitions: 12
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m
  retry:
    maxRetries: 30
    backoffSeconds: 5

# -- PostgreSQL databases (order, payment, inventory)
databases:
  order:
    enabled: true
    dbName: order_db
    serviceSuffix: order-service-postgresql
    storage: 1Gi
    image:
      repository: postgres
      tag: latest
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 1Gi
        cpu: 500m
  payment:
    enabled: true
    dbName: payment_db
    serviceSuffix: payment-service-postgresql
    storage: 1Gi
    image:
      repository: postgres
      tag: latest
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 1Gi
        cpu: 500m
  inventory:
    enabled: true
    dbName: inventory_db
    serviceSuffix: inventory-service-postgresql
    storage: 1Gi
    image:
      repository: postgres
      tag: latest
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 1Gi
        cpu: 500m

# -- MongoDB for analytics
mongodb:
  enabled: true
  image:
    repository: mongo
    tag: latest
  port: 27017
  dbName: analytics_db
  storage: 1Gi
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 1Gi
      cpu: 500m

# -- Application services
services:
  frontend:
    enabled: true
    replicas: 1
    image:
      repository: frontend
      tag: v4
    port: 80
    resources:
      requests:
        memory: 64Mi
        cpu: 50m
      limits:
        memory: 128Mi
        cpu: 200m

  apiGateway:
    enabled: true
    replicas: 2
    image:
      repository: api-gateway
      tag: v3
    port: 9000
    resources:
      requests:
        memory: 512Mi
        cpu: 250m
      limits:
        memory: 1Gi
        cpu: 500m
    livenessProbe:
      httpGet:
        path: /actuator/health/liveness
        port: 9000
      initialDelaySeconds: 60
      periodSeconds: 15
      timeoutSeconds: 5
    readinessProbe:
      httpGet:
        path: /actuator/health/readiness
        port: 9000
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 3

  orderService:
    enabled: true
    replicas: 2
    image:
      repository: order-service
      tag: v4
    port: 8081
    resources:
      requests:
        memory: 512Mi
        cpu: 250m
      limits:
        memory: 1Gi
        cpu: 500m
    livenessProbe:
      httpGet:
        path: /actuator/health/liveness
        port: 8081
      initialDelaySeconds: 90
      periodSeconds: 15
    readinessProbe:
      httpGet:
        path: /actuator/health/readiness
        port: 8081
      initialDelaySeconds: 30
      periodSeconds: 10
    startupProbe:
      httpGet:
        path: /actuator/health
        port: 8081
      initialDelaySeconds: 0
      periodSeconds: 10
      failureThreshold: 30

  paymentService:
    enabled: true
    replicas: 2
    image:
      repository: payment-service
      tag: v1
    port: 8083
    resources:
      requests:
        memory: 512Mi
        cpu: 250m
      limits:
        memory: 1Gi
        cpu: 500m
    livenessProbe:
      httpGet:
        path: /actuator/health/liveness
        port: 8083
      initialDelaySeconds: 90
      periodSeconds: 15
    readinessProbe:
      httpGet:
        path: /actuator/health/readiness
        port: 8083
      initialDelaySeconds: 30
      periodSeconds: 10
    startupProbe:
      httpGet:
        path: /actuator/health
        port: 8083
      initialDelaySeconds: 0
      periodSeconds: 10
      failureThreshold: 30

  inventoryService:
    enabled: true
    replicas: 2
    image:
      repository: inventory-service
      tag: v1
    port: 8082
    resources:
      requests:
        memory: 512Mi
        cpu: 250m
      limits:
        memory: 1Gi
        cpu: 500m
    livenessProbe:
      httpGet:
        path: /actuator/health/liveness
        port: 8082
      initialDelaySeconds: 90
      periodSeconds: 15
    readinessProbe:
      httpGet:
        path: /actuator/health/readiness
        port: 8082
      initialDelaySeconds: 30
      periodSeconds: 10
    startupProbe:
      httpGet:
        path: /actuator/health
        port: 8082
      initialDelaySeconds: 0
      periodSeconds: 10
      failureThreshold: 30

  analyticsService:
    enabled: true
    replicas: 2
    image:
      repository: analytics-service
      tag: v1
    port: 8084
    resources:
      requests:
        memory: 512Mi
        cpu: 250m
      limits:
        memory: 1Gi
        cpu: 500m
    livenessProbe:
      httpGet:
        path: /actuator/health/liveness
        port: 8084
      initialDelaySeconds: 90
      periodSeconds: 15
    readinessProbe:
      httpGet:
        path: /actuator/health/readiness
        port: 8084
      initialDelaySeconds: 30
      periodSeconds: 10
    startupProbe:
      httpGet:
        path: /actuator/health
        port: 8084
      initialDelaySeconds: 0
      periodSeconds: 10
      failureThreshold: 30

# -- Ingress configuration
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://ecommerce.local,http://localhost:3000,http://localhost:9000,http://localhost"
  rules:
    - host: ecommerce.local
      paths:
        - path: /
          pathType: Prefix
          service: frontend
          port: 80
    - host: api.ecommerce.local
      paths:
        - path: /api/orders
          pathType: Prefix
          service: api-gateway
          port: 9000
        - path: /api/payments
          pathType: Prefix
          service: api-gateway
          port: 9000
        - path: /api/inventory
          pathType: Prefix
          service: api-gateway
          port: 9000
        - path: /api/admin
          pathType: Prefix
          service: api-gateway
          port: 9000
