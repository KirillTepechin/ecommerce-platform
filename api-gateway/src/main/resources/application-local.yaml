server:
  port: 8080

spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8086/realms/ecommerce-realm
          jwk-set-uri: http://localhost:8086/realms/ecommerce-realm/protocol/openid-connect/certs

      client:
        registration:
          keycloak:
            client-id: api-gateway
            client-secret: api-gateway-secret
            authorization-grant-type: client_credentials
            scope: openid,profile,email
        provider:
          keycloak:
            issuer-uri: http://localhost:8086/realms/ecommerce-realm
            user-name-attribute: preferred_username
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/orders/**
              filters:
                - StripPrefix=1
                - TokenRelay=
                - name: UserContextFilter
                - name: CircuitBreaker
                  args:
                    name: orderServiceCircuitBreaker
                    fallbackUri: forward:/fallback/order-service

            - id: order-service-admin
              uri: lb://order-service
              predicates:
                - Path=/api/admin/orders/**
              filters:
                - StripPrefix=1
                - TokenRelay=
                - name: UserContextFilter
                - name: CircuitBreaker
                  args:
                    name: orderServiceCircuitBreaker
                    fallbackUri: forward:/fallback/order-service

            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/payments/**
              filters:
                - StripPrefix=1
                - TokenRelay=
                - name: UserContextFilter
                - name: CircuitBreaker
                  args:
                    name: paymentServiceCircuitBreaker
                    fallbackUri: forward:/fallback/payment-service

            - id: inventory-service
              uri: lb://inventory-service
              predicates:
                - Path=/api/inventory/**
              filters:
                - StripPrefix=1
                - TokenRelay=
                - name: UserContextFilter
                - name: CircuitBreaker
                  args:
                    name: inventoryServiceCircuitBreaker
                    fallbackUri: forward:/fallback/inventory-service

  # Resilience4j Circuit Breaker конфигурация
  resilience4j:
    circuitbreaker:
      configs:
        default:
          sliding-window-size: 10
          minimum-number-of-calls: 5
          permitted-number-of-calls-in-half-open-state: 3
          automatic-transition-from-open-to-half-open-enabled: true
          wait-duration-in-open-state: 5s
          failure-rate-threshold: 50
          event-consumer-buffer-size: 10
        slow:
          sliding-window-size: 10
          minimum-number-of-calls: 5
          permitted-number-of-calls-in-half-open-state: 3
          wait-duration-in-open-state: 10s
          failure-rate-threshold: 50
          slow-call-rate-threshold: 100
          slow-call-duration-threshold: 2s
      instances:
        orderServiceCircuitBreaker:
          base-config: default
        paymentServiceCircuitBreaker:
          base-config: slow
        inventoryServiceCircuitBreaker:
          base-config: default

    # Retry конфигурация
    retry:
      configs:
        default:
          max-attempts: 3
          wait-duration: 1s
          retry-exceptions:
            - org.springframework.web.client.HttpServerErrorException
            - java.io.IOException
      instances:
        orderServiceRetry:
          base-config: default
        paymentServiceRetry:
          base-config: default

  # Actuator для мониторинга Circuit Breaker
  management:
    endpoints:
      web:
        exposure:
          include: health,info,metrics,prometheus,circuitbreakers
    endpoint:
      health:
        show-details: always
      circuitbreakers:
        enabled: true
    metrics:
      export:
        prometheus:
          enabled: true

jwt:
  user-id-claim: customer_id
  user-name-claim: preferred_username
  roles-claim: realm_access.roles

# Eureka конфигурация
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# Logging
logging:
  level:
    io.github.resilience4j: DEBUG
    org.springframework.cloud.gateway: DEBUG