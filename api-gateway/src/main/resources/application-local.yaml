server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true  # ?????????????? ???????? ????????? ?? ?????? ???????? ? Eureka
          lower-case-service-id: true
      routes:
        # ????? ???????? ??? order-service (????? ????????????? ? ???????????????)
        - id: order-service
          uri: lb://order-service  # lb:// = load balancing ????? Eureka
          predicates:
            - Path=/api/orders/**
          filters:
            - StripPrefix=1  # ??????? /api ?? ???? ??? ?????????????

        # ??????? ??? ????????? ?????? gateway
        - id: gateway-actuator
          uri: http://localhost:${server.port}
          predicates:
            - Path=/actuator/**

# ??????????? ? Eureka
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# Actuator ??? ??????????? gateway
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway,routes
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true